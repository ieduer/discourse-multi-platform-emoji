multi_platform_emoji_enabled:
  type: bool
  default: true
  description:
    en: "Enable multi-platform emoji tabs in the emoji picker"

emoji_asset_origin:
  type: string
  default: ""
  description:
    en: "HTTPS origin of your emoji asset service, without a path (for example https://emoji.example.com). Blank or invalid means no rewriting or platform tabs. There is no built-in asset service."

emoji_platforms_enabled:
  type: list
  default: "apple|google|noto|twitter|twemoji|win10|facebook_messenger|emoji_one|google_classic|fluentui|openmoji|unicode"
  description:
    en: "Enabled emoji platforms (pipe-separated). Must match R2 folder names: apple, google, noto, twitter, twemoji, win10, facebook_messenger, emoji_one, google_classic, fluentui, openmoji, unicode"

show_platform_prefix:
  type: bool
  default: false
  description:
    en: "Show platform prefix in emoji tooltip (e.g. 'twemoji: grinning')"

platform_tab_style:
  type: enum
  default: "icons"
  choices:
    - icons
    - text
    - both
  description:
    en: "Style for platform filter tabs: icons only, text only, or both"
